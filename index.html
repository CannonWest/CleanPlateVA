<!DOCTYPE html>
<!-- CR app entry (CRF-M0, design ref §3). This is Vite's root index.html —
     the dev-server page and the template for dist/index.html. It is NOT the
     served site: public/index.html (the no-build client) keeps serving until
     CRC flips assets.directory to ./dist. Dark is the document default (C10);
     .theme-light on <html> flips the theme (docs/mockups/tokens.css). -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- The mount (C7, D-CR-EMBED-1): the host serves this file for any view
         path, so the built asset URLs (./assets/*) and the app's relative
         data paths resolve from here rather than from the current path. The
         CannonAI Food tab serves this same file under /cleanplate/ and
         rewrites this one href; the router reads document.baseURI. -->
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CleanPlateVA — archived VDH inspection finder</title>
    <script>
    // Apply the stored theme before first paint to avoid a flash. Dark is
    // the document default (C10); the key matches app/theme.ts.
    (function () {
        try {
            if (localStorage.getItem('cleanplateva.theme') === 'light') {
                document.documentElement.classList.add('theme-light');
            }
        } catch (e) { /* private mode: dark default stands */ }
    })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
</body>
</html>
