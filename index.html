<!DOCTYPE html>
<!-- CR app entry (CRF-M0, design ref §3). This is Vite's root index.html —
     the dev-server page and the template for dist/index.html, the served
     site since CRC (2026-09-06; wrangler.jsonc assets.directory ./dist).
     Light is the visitor default (2026-09-06, C10 amended): the un-prefixed
     CSS is the dark design and .theme-light on <html> is the light hook
     (docs/mockups/tokens.css), applied below unless the visitor chose dark. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- The mount (C7, D-CR-EMBED-1): the host serves this file for any view
         path, so the built asset URLs (./assets/*) and the app's relative
         data paths resolve from here rather than from the current path. The
         host's Food tab serves this same file under /cleanplate/ and
         rewrites this one href; the router reads document.baseURI. -->
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Site icons, rendered from the brand mark by tools/make_favicon.py and
         shipped from public/ under stable names (a content-hashed
         dist/assets/ name is unreachable for a bare probe). Relative hrefs,
         so they resolve through the <base> above and follow the mount when
         the host's Food tab rewrites it. Absent these files the assets
         layer answers /favicon.ico with the SPA shell -- 200 text/html,
         measured on production 2026-09-06 -- and the tab shows the generic
         globe. The ico is a rounded dark tile (--cp-surface-1 dark): the
         mark's plate is white and Chrome's tab strip is near-white, so
         untiled it disappears at 16px. -->
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <!-- The page title is the NAME and nothing else (2026-09-09): the tab
         strip truncates anyway, and a description there read as clutter on
         every tab and bookmark. app/useAppRouter.ts captures whatever stands
         here as the base title and router.ts prefixes the view, so List and
         About follow it without a second edit. -->
    <title>CleanPlateVA</title>
    <script>
    // Apply the stored theme, grade palette and text size before first paint
    // to avoid a flash. The theme is three-way (2026-09-06): 'dark' and
    // 'light' are the visitor's own words; anything else — the default —
    // follows the device's appearance. The class goes on whenever the
    // RESOLVED theme is light; the key and the rule match app/theme.ts
    // (storedTheme + resolveDark). The palette class goes on for the one
    // stored word 'colorblind' (app/palette.ts storedPalette). The text size
    // is the body size in px, honored when it is an integer in 12..20 and
    // applied as its ratio to the ratified 14 (app/settings.ts validTextSize
    // + applyTextSize). Pinned by tests/vitest/theme.spec.ts, palette.spec.ts
    // and settings.spec.ts, which run this script.
    (function () {
        var theme = null;
        var palette = null;
        var size = null;
        try {
            theme = localStorage.getItem('cleanplateva.theme');
            palette = localStorage.getItem('cleanplateva.gradePalette');
            size = localStorage.getItem('cleanplateva.textSize');
        } catch (e) { /* private mode: the defaults stand */ }
        var dark = theme === 'dark' || (theme !== 'light'
            && !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
        if (!dark) {
            document.documentElement.classList.add('theme-light');
        }
        if (palette === 'colorblind') {
            document.documentElement.classList.add('palette-colorblind');
        }
        var px = Number(size);
        if (size === null || !Number.isInteger(px) || px < 12 || px > 20) {
            px = 16;
        }
        if (px === 14) {
            document.documentElement.style.removeProperty('--cp-text-scale');
        } else {
            document.documentElement.style.setProperty('--cp-text-scale', String(px / 14));
        }
    })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
</body>
</html>
