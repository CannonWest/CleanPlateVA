# Push to main deploys production (Cloudflare Workers Builds), so the PR
# check is the last gate before a change is live. Runs the whole node:test
# suite — including tests/lite-roster-contract.test.mjs, which validates the
# COMMITTED public/data/finder/*.json + manifest.json and is the tripwire
# for a stale export overwriting the public payload with an older shape.
#
# No dependencies and no install step: the suite is plain node:test over
# source files and the committed shard set.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
