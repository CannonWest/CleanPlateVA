# Dependabot version updates.
#
# This repo has exactly two ecosystems: the npm tree at the root, and the
# actions the CI workflow pins. Nothing else — no Dockerfile, no Python
# manifest, no submodules.

version: 2
updates:
  # The app: React, Vite, Tailwind, MapLibre, Vitest, Playwright.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One pull request a week for the routine bumps rather than one per
      # package. Majors stay separate on purpose: they are the ones that
      # can move the build or the map, and they deserve their own diff and
      # their own CI run.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # actions/checkout, actions/setup-node and actions/upload-artifact are all
  # pinned at v4, which is why every CI run currently warns that they target
  # a deprecated Node 20 and are being forced onto Node 24.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
